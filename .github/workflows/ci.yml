# Dueño: Aleja · El semáforo de cada PR: estilo (ruff) y pruebas (pytest)
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar librerías
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Estilo
        run: ruff check .
      - name: Pruebas
        run: pytest
